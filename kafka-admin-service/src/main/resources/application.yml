server:
  port: 8086
spring:
  application:
    name: kafka-admin-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI:https://login.microsoftonline.com/bb5324af-c266-41ed-b36c-a971641c7af2/v2.0}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
springdoc:
  paths-to-match: /internal/kafka/**
app:
  security:
    audience: ${ENTRA_API_AUDIENCE:api://6c685bd4-57e4-4ba3-aa63-c8bd6a00cd4d}
  internal:
    key: ${INTERNAL_SERVICE_KEY:}
  kafka-admin:
    allow-delete: ${KAFKA_ADMIN_ALLOW_DELETE:false}
