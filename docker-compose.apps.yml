# Six private Java APIs. Run with --env-file .env.apps; bind ports to the EC2
# private address and allow inbound traffic only from the internal ALB SG.
x-common-env: &common-env
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID}
  ENTRA_API_AUDIENCE: ${ENTRA_API_AUDIENCE:?Set ENTRA_API_AUDIENCE}
  FRONT_URL: ${FRONT_URL:?Set FRONT_URL}
  INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS}

x-rabbit-env: &rabbit-env
  RABBITMQ_HOST: ${RABBITMQ_HOST:?Set RABBITMQ_HOST}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/pedidos360}

x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: 3306
  DB_SSL_MODE: DISABLED

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      PEDIDOS_DB_PASSWORD: ${PEDIDOS_DB_PASSWORD:?Set PEDIDOS_DB_PASSWORD}
      PRODUCTOS_DB_PASSWORD: ${PRODUCTOS_DB_PASSWORD:?Set PRODUCTOS_DB_PASSWORD}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:?Set REPORT_DB_PASSWORD}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?Set AUDIT_DB_PASSWORD}
    volumes:
      - pedidos360-mysql-data:/var/lib/mysql
      - ./db/001_create_databases.sql:/docker-entrypoint-initdb.d/01_create_databases.sql:ro
      - ./db/002_create_users.sh:/docker-entrypoint-initdb.d/02_create_users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${AUDIT_DB_PASSWORD}\" mysql -uaudit_app -Dauditdb -h localhost --silent -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [pedidos360-apps]

  pedidos-service:
    build: ./pedidos-service
    restart: unless-stopped
    environment:
      <<: [*common-env, *rabbit-env, *db-env]
      SPRING_PROFILES_ACTIVE: prod,kafka-compose
      DB_NAME: pedidosdb
      DB_USER: pedidos_app
      DB_PASSWORD: ${PEDIDOS_DB_PASSWORD:?Set PEDIDOS_DB_PASSWORD}
      PRODUCTS_INTERNAL_URL: http://productos-service:8082
      PRODUCTS_HEALTH_URL: http://productos-service:8082/internal/health
      REPORT_SERVICE_URL: http://report-service:8085/internal/health
      AUDIT_SERVICE_URL: http://audit-service:8084/internal/health
      REQUIRE_WRITE_SCOPE: ${REQUIRE_WRITE_SCOPE:-true}
      AUDIT_KAFKA_ENABLED: "true"
      REPORT_KAFKA_ENABLED: "true"
      OPTIONAL_WORK_ENABLED: ${OPTIONAL_WORK_ENABLED:-false}
      RABBIT_DLQ_MONITOR_ENABLED: ${RABBIT_DLQ_MONITOR_ENABLED:-true}
      RABBIT_DEMO_ENABLED: ${RABBIT_DEMO_ENABLED:-true}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8081:8081"
    depends_on:
      mysql: { condition: service_healthy }
    networks: [pedidos360-apps]

  productos-service:
    build: ./productos-service
    restart: unless-stopped
    environment:
      <<: [*common-env, *rabbit-env, *db-env]
      SPRING_PROFILES_ACTIVE: prod,kafka-compose
      DB_NAME: productosdb
      DB_USER: productos_app
      DB_PASSWORD: ${PRODUCTOS_DB_PASSWORD:?Set PRODUCTOS_DB_PASSWORD}
      REQUIRE_WRITE_SCOPE: ${REQUIRE_WRITE_SCOPE:-true}
      AUDIT_KAFKA_ENABLED: "true"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8082:8082"
    depends_on:
      mysql: { condition: service_healthy }
    networks: [pedidos360-apps]

  report-service:
    build: ./report-service
    restart: unless-stopped
    environment:
      <<: [*common-env, *db-env]
      SPRING_PROFILES_ACTIVE: prod,kafka-compose
      DB_NAME: reportdb
      DB_USER: report_app
      DB_PASSWORD: ${REPORT_DB_PASSWORD:?Set REPORT_DB_PASSWORD}
      REPORT_KAFKA_ENABLED: "true"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8085:8085"
    depends_on:
      mysql: { condition: service_healthy }
    networks: [pedidos360-apps]

  audit-service:
    build: ./audit-service
    restart: unless-stopped
    environment:
      <<: [*common-env, *db-env]
      SPRING_PROFILES_ACTIVE: prod,kafka-compose
      DB_NAME: auditdb
      DB_USER: audit_app
      DB_PASSWORD: ${AUDIT_DB_PASSWORD:?Set AUDIT_DB_PASSWORD}
      AUDIT_KAFKA_ENABLED: "true"
      AUDIT_DLT_MONITOR_ENABLED: "true"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8084:8084"
    depends_on:
      mysql: { condition: service_healthy }
    networks: [pedidos360-apps]

  rabbit-admin-service:
    build: ./rabbit-admin-service
    restart: unless-stopped
    environment:
      <<: [*common-env, *rabbit-env]
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8083:8083"
    networks: [pedidos360-apps]

  kafka-admin-service:
    build: ./kafka-admin-service
    restart: unless-stopped
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: prod,kafka-compose
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8086:8086"
    networks: [pedidos360-apps]

networks:
  pedidos360-apps:
    name: pedidos360-apps

volumes:
  pedidos360-mysql-data:
