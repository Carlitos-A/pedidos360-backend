server:
  port: 8082

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
  jackson:
    deserialization:
      accept-float-as-int: false
  rabbitmq:
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pedidos360}
    password: ${RABBITMQ_PASSWORD:pedidos360-local}
    virtual-host: ${RABBITMQ_VHOST:/pedidos360}
  application:
    name: productos-service

  datasource:
    url: jdbc:h2:mem:productosdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/bb5324af-c266-41ed-b36c-a971641c7af2/v2.0

app:
  audit:
    kafka-enabled: ${AUDIT_KAFKA_ENABLED:false}
    topic: ${AUDIT_KAFKA_TOPIC:pedidos360.audit.v1}
  internal:
    key: ${INTERNAL_SERVICE_KEY:}
  security:
    audience: api://6c685bd4-57e4-4ba3-aa63-c8bd6a00cd4d
    require-write-scope: ${REQUIRE_WRITE_SCOPE:false}
