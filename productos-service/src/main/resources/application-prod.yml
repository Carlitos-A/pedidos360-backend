# ============================================================
# PERFIL DE PRODUCCIÓN (AWS) — productos-service
# Se activa con:  java -jar productos-service.jar --spring.profiles.active=prod
# Las credenciales llegan por VARIABLES DE ENTORNO (nunca en el repo)
# ============================================================
server:
  port: 8082

spring:
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  jackson:
    deserialization:
      accept-float-as-int: false
  rabbitmq:
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/pedidos360}
  application:
    name: productos-service

  # Base de datos cloud: AWS RDS (MySQL)
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:productosdb}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0

app:
  internal:
    key: ${INTERNAL_SERVICE_KEY:}
  security:
    audience: ${ENTRA_API_AUDIENCE}
    require-write-scope: ${REQUIRE_WRITE_SCOPE:true}
  cors:
    # Origen de GitHub Pages, sin la ruta del repositorio.
    allowed-origins: ${FRONT_URL}
