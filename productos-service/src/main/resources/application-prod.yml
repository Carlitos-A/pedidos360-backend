# ============================================================
# PERFIL DE PRODUCCIÓN (AWS) — productos-service
# Se activa con:  java -jar productos-service.jar --spring.profiles.active=prod
# Las credenciales llegan por VARIABLES DE ENTORNO (nunca en el repo)
# ============================================================
server:
  port: 8082

spring:
  kafka:
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: AWS_MSK_IAM
      sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
  jackson:
    deserialization:
      accept-float-as-int: false
  rabbitmq:
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/pedidos360}
  application:
    name: productos-service

  # Base de datos cloud: AWS RDS (MySQL)
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:productosdb}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/bb5324af-c266-41ed-b36c-a971641c7af2/v2.0

app:
  internal:
    key: ${INTERNAL_SERVICE_KEY:}
  security:
    audience: api://6c685bd4-57e4-4ba3-aa63-c8bd6a00cd4d
    require-write-scope: ${REQUIRE_WRITE_SCOPE:false}
  cors:
    # Origen de GitHub Pages, sin la ruta del repositorio.
    allowed-origins: ${FRONT_URL:https://carlitos-a.github.io}
