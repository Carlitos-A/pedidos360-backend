server:
  port: 8081

spring:
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: pedidos-service

  # Base de datos H2 en memoria para desarrollo local.
  # En la etapa de despliegue se cambia por la BD cloud (RDS/Azure SQL)
  # y las credenciales pasan a variables de entorno.
  datasource:
    url: jdbc:h2:mem:pedidosdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: update

  # Validación del JWT emitido por Microsoft Entra ID.
  # Con issuer-uri, Spring valida automáticamente firma, emisor y vigencia.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI:https://login.microsoftonline.com/bb5324af-c266-41ed-b36c-a971641c7af2/v2.0}

  rabbitmq:
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pedidos360}
    password: ${RABBITMQ_PASSWORD:pedidos360-local}
    virtual-host: ${RABBITMQ_VHOST:/pedidos360}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        concurrency: 1
        max-concurrency: 3

# Audience esperada: el Application ID URI de la app "Pedidos360-API"
springdoc:
  paths-to-match: /api/**
app:
  optional-work:
    enabled: ${OPTIONAL_WORK_ENABLED:false}
    retry-attempts: ${OPTIONAL_WORK_RETRY_ATTEMPTS:3}
    retry-delay-ms: ${OPTIONAL_WORK_RETRY_DELAY_MS:500}
  audit:
    kafka-enabled: ${AUDIT_KAFKA_ENABLED:false}
    topic: ${AUDIT_KAFKA_TOPIC:pedidos360.audit.v1}
  report:
    kafka-enabled: ${REPORT_KAFKA_ENABLED:false}
    topic: ${REPORT_KAFKA_TOPIC:pedidos360.orders.events.v1}
  health:
    bff-url: ${BFF_HEALTH_URL:}
    products-url: ${PRODUCTS_HEALTH_URL:http://localhost:8082/internal/health}
    audit-url: ${AUDIT_SERVICE_URL:}
    report-url: ${REPORT_SERVICE_URL:}
  internal:
    key: ${INTERNAL_SERVICE_KEY:}
  products:
    internal-url: ${PRODUCTS_INTERNAL_URL:http://localhost:8082}
  identity:
    tenant-id: ${ENTRA_TENANT_ID:bb5324af-c266-41ed-b36c-a971641c7af2}
    graph-client-id: ${GRAPH_CLIENT_ID:}
    graph-client-secret: ${GRAPH_CLIENT_SECRET:}
    api-service-principal-id: ${API_SERVICE_PRINCIPAL_ID:}
    customer-role-id: ${CUSTOMER_ROLE_ID:}
  security:
    audience: ${ENTRA_API_AUDIENCE:api://6c685bd4-57e4-4ba3-aa63-c8bd6a00cd4d}
    require-write-scope: ${REQUIRE_WRITE_SCOPE:false}

pedidos360:
  messaging:
    dlq-monitor-enabled: ${RABBIT_DLQ_MONITOR_ENABLED:false}
    exchanges:
      orders-direct: pedidos360.orders.direct
      orders-topic: pedidos360.orders.topic
      dead-letter: pedidos360.dead-letter
    queues:
      notification: pedidos360.orders.notification
      notification-dlq: pedidos360.orders.notification.dlq
      ticket: pedidos360.orders.ticket
      ticket-dlq: pedidos360.orders.ticket.dlq
      audit: pedidos360.orders.audit
      audit-dlq: pedidos360.orders.audit.dlq
    routing-keys:
      order-created: orders.created
      ticket-created: orders.created.ticket
      audit-created: orders.created.audit
      status-changed: orders.status.changed
      order-cancelled: orders.cancelled
