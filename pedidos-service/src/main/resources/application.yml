server:
  port: 8081

spring:
  application:
    name: pedidos-service

  # Base de datos H2 en memoria para desarrollo local.
  # En la etapa de despliegue se cambia por la BD cloud (RDS/Azure SQL)
  # y las credenciales pasan a variables de entorno.
  datasource:
    url: jdbc:h2:mem:pedidosdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update

  # Validación del JWT emitido por Microsoft Entra ID.
  # Con issuer-uri, Spring valida automáticamente firma, emisor y vigencia.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/bb5324af-c266-41ed-b36c-a971641c7af2/v2.0

# Audience esperada: el Application ID URI de la app "Pedidos360-API"
app:
  security:
    audience: api://6c685bd4-57e4-4ba3-aa63-c8bd6a00cd4d
