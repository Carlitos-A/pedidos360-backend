# ============================================================
# PERFIL DE PRODUCCIÓN (AWS) — pedidos-service
# Se activa con:  java -jar pedidos-service.jar --spring.profiles.active=prod
# Las credenciales llegan por VARIABLES DE ENTORNO (nunca en el repo)
# ============================================================
server:
  port: 8081

spring:
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: pedidos-service

  # Base de datos cloud: AWS RDS (MySQL)
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:pedidosdb}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0

  rabbitmq:
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/pedidos360}

app:
  health:
    bff-url: ${BFF_HEALTH_URL:}
    products-url: ${PRODUCTS_HEALTH_URL:}
    audit-url: ${AUDIT_SERVICE_URL:}
    report-url: ${REPORT_SERVICE_URL:}
  internal:
    key: ${INTERNAL_SERVICE_KEY:}
  products:
    internal-url: ${PRODUCTS_INTERNAL_URL:http://localhost:8082}
  identity:
    tenant-id: ${ENTRA_TENANT_ID}
  security:
    audience: ${ENTRA_API_AUDIENCE}
    require-write-scope: ${REQUIRE_WRITE_SCOPE:true}
  cors:
    # Origen de GitHub Pages, sin la ruta del repositorio.
    allowed-origins: ${FRONT_URL}
