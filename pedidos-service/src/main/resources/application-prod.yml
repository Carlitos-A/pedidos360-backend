# ============================================================
# PERFIL DE PRODUCCIÓN (AWS) — pedidos-service
# Se activa con:  java -jar pedidos-service.jar --spring.profiles.active=prod
# Las credenciales llegan por VARIABLES DE ENTORNO (nunca en el repo)
# ============================================================
server:
  port: 8081

spring:
  application:
    name: pedidos-service

  # Base de datos cloud: AWS RDS (MySQL)
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:pedidosdb}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/bb5324af-c266-41ed-b36c-a971641c7af2/v2.0

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/pedidos360}

app:
  security:
    audience: api://6c685bd4-57e4-4ba3-aa63-c8bd6a00cd4d
  cors:
    # URL del frontend en S3 (variable de entorno en el EC2)
    allowed-origins: ${FRONT_URL:http://localhost:4200}
